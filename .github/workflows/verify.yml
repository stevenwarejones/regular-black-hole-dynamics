name: verify
on:
  push:
  pull_request:
jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run verification pipeline
        run: python run_checks.py
      - name: pytest
        run: pytest -q
